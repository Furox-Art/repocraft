[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repocraft"
version = "0.1.0"
description = "Deterministic Python project scaffolding from a validated spec."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Furkan" }]
keywords = ["scaffolding", "code-generation", "python", "deterministic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
repocraft = "repocraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repocraft"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
norecursedirs = ["golden"]

[tool.coverage.run]
branch = true
source = ["repocraft"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
exclude = ["^tests/golden/"]
